<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NVDAナビゲーターの表示設定</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">NVDAナビゲーター</p>
        <h1>表示設定</h1>
        <p>Webページに固定表示するショートカットパネルの位置と色を変更できます。</p>
      </header>

      <form id="settings-form">
        <label for="position">パネルの表示位置</label>
        <select id="position" name="position">
          <option value="top-left">左上</option>
          <option value="top-right">右上</option>
          <option value="bottom-left">左下</option>
          <option value="bottom-right">右下</option>
          <option value="center">画面中央</option>
        </select>

        <label for="text-color">文字色</label>
        <input id="text-color" name="textColor" type="color" value="#172033">

        <label for="background-color">背景色</label>
        <input id="background-color" name="backgroundColor" type="color" value="#fff4cc">

        <div class="actions">
          <button type="submit">設定を保存</button>
          <button id="reset" class="secondary" type="button">初期設定に戻す</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="note">設定は保存後すぐに表示中のパネルにも反映されます。</p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
