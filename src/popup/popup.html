<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NVDAナビゲーター</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="page-header">
        <p class="eyebrow">スクリーンリーダー操作ガイド</p>
        <h1>NVDAナビゲーター</h1>
      </header>
      <p id="status" role="status" aria-live="polite">ページ上のパネルを表示／非表示にできます。</p>
      <p class="hint">表示位置や色は設定から変更できます。NVDAキーは通常 Insert または Caps Lock です。</p>
      <div class="actions">
        <button id="toggle-panel" type="button">パネルを表示／閉じる</button>
        <button id="open-settings" class="secondary" type="button">表示設定を開く</button>
      </div>
      <div id="shortcut-list" hidden></div>
    </main>
    <script src="../shared/shortcuts.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
